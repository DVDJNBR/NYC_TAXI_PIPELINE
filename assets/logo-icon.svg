  <!-- La course d'un taxi sur la grille de Manhattan : deux avenues remontees,
       une rue traversee, le point d'arrivee. Un taxi n'y roule jamais en
       diagonale, et cette marche d'escalier est aussi la forme d'une courbe en
       escalier — la famille de graphique qui dit « une valeur tient jusqu'au
       prochain changement ». Les deux lectures sont le meme trace.

       Le cadre n'est pas un rectangle arrondi mais une superellipse
       x^4 + y^4 = r^4, echantillonnee sur 128 points : la courbure y monte
       sans sauter au raccord, la ou un border-radius passe d'un coup de 0 a
       1/r. Virages du trace au rayon 4 px, soit un peu moins que l'epaisseur
       du trait. -->
