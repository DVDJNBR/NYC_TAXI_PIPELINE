name: Deploy to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Create dummy data folder for build test
        run: mkdir -p data
      - name: Test Docker Build
        run: docker compose build

  deploy:
    runs-on: ubuntu-latest
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          port: 5790
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/NYC_TAXI_PIPELINE
            git pull origin main
            # Le conteneur porte un nom fixe (container_name dans
            # docker-compose.yml). Dès que compose en perd la trace — un
            # recreate interrompu, un `up` lancé depuis un autre dossier,
            # un projet renommé — il le recrée et bute sur son propre nom :
            #   Conflict. The container name "/nyc-taxi-dashboard" is
            #   already in use by container "..."
            # Deux déploiements de suite ont échoué là-dessus. On enlève donc
            # ce qui porte le nom avant de remonter, au lieu de le nettoyer
            # à la main à chaque fois. Les deux commandes ne doivent pas
            # faire échouer le script quand il n'y a rien à enlever.
            docker compose down --remove-orphans || true
            docker rm -f nyc-taxi-dashboard 2>/dev/null || true
            docker compose up --build -d
